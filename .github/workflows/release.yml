name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch release tags
        run: |
          git fetch --tags origin
          git fetch --no-tags https://github.com/cohesity/terraform-provider-cohesity.git 'refs/tags/v*:refs/upstream-release-tags/v*'

      - name: Check release credentials
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: test -n "$RELEASE_SIGNING_KEY"

      - name: Compute and create next tag
        id: next_tag
        shell: bash
        run: |
          set -euo pipefail

          # Old fork tags may be closer to a merge than its upstream release.
          # Select the highest stable upstream version already included in main.
          base_tag="$(
            git for-each-ref --merged=HEAD --sort=-version:refname \
              --format='%(refname:strip=2)' refs/upstream-release-tags |
              awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found {print; found=1}'
          )"
          if [[ -z "$base_tag" ]]; then
            echo "No stable upstream release tag is reachable from main"
            exit 1
          fi

          max_n=0
          while IFS= read -r t; do
            if [[ "$t" =~ -stegra[.-]([0-9]+)$ ]]; then
              n=$((10#${BASH_REMATCH[1]}))
              if (( n > max_n )); then
                max_n="$n"
              fi
            fi
          done < <(
            {
              git tag -l "${base_tag}-stegra.*"
              git tag -l "${base_tag}-stegra-*"
            } | sort -u
          )

          next_n=$((max_n + 1))
          next_tag="${base_tag}-stegra.${next_n}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Automated release tag $next_tag"
          git push origin "$next_tag"

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.27.3"
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.13.3
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
